<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BOSS SHOOTER</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    width:100vw;
    height:100vh;
    overflow:hidden;
    background:linear-gradient(180deg,#0f172a,#000);
    display:flex;
    justify-content:center;
    align-items:center;
    color:white;
}

.menu{
    text-align:center;
}

h1{
    font-size:80px;
    color:#ff3b3b;
    text-shadow:0 0 20px red;
    margin-bottom:15px;
}

.subtitle{
    font-size:24px;
    color:#dddddd;
    margin-bottom:50px;
}

button{
    width:260px;
    height:60px;
    margin:10px;
    border:none;
    border-radius:12px;
    background:#ff3b3b;
    color:white;
    font-size:24px;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    transform:scale(1.08);
    background:#ff6060;
}

.version{
    position:fixed;
    bottom:20px;
    right:20px;
    color:#888;
}

#stars{
    position:fixed;
    width:100%;
    height:100%;
    pointer-events:none;
}
</style>

</head>
<body>

<canvas id="stars"></canvas>

<div class="menu">

    <h1>BOSS SHOOTER</h1>

    <div class="subtitle">
        최강의 보스를 쓰러뜨려라!
    </div>

    <button onclick="startGame()">🎮 게임 시작</button><br>

    <button onclick="alert('준비 중입니다.')">📖 게임 방법</button><br>

    <button onclick="alert('준비 중입니다.')">⚙ 설정</button><br>

    <button onclick="alert('감사합니다!')">🚪 종료</button>

</div>

<div class="version">
v1.0
</div>

<script>
function startGame(){
    alert("게임이 시작됩니다!");
}

// 별 배경
const canvas = document.getElementById("stars");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const stars = [];

for(let i=0;i<150;i++){
    stars.push({
        x:Math.random()*canvas.width,
        y:Math.random()*canvas.height,
        r:Math.random()*2+1,
        s:Math.random()*0.6+0.2
    });
}

function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);

    ctx.fillStyle="white";

    for(const star of stars){
        ctx.beginPath();
        ctx.arc(star.x,star.y,star.r,0,Math.PI*2);
        ctx.fill();

        star.y += star.s;

        if(star.y > canvas.height){
            star.y = 0;
            star.x = Math.random()*canvas.width;
        }
    }

    requestAnimationFrame(draw);
}

draw();

window.onresize=()=>{
    canvas.width=window.innerWidth;
    canvas.height=window.innerHeight;
}
</script>

</body>
</html>
