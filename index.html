<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>천재채호 - 보스전</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:linear-gradient(#111,#000);
    overflow:hidden;
    font-family:"Malgun Gothic", sans-serif;
}

/* 움직이는 별 배경 */
body::before{
    content:"";
    position:fixed;
    width:200%;
    height:200%;
    background:radial-gradient(white 1px, transparent 1px);
    background-size:50px 50px;
    opacity:0.15;
    animation:stars 40s linear infinite;
}

@keyframes stars{
    from{transform:translateY(0);}
    to{transform:translateY(-500px);}
}

.menu{
    position:absolute;
    width:100%;
    height:100%;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    color:white;
    text-align:center;
}

h1{
    font-size:80px;
    color:#ff3030;
    text-shadow:0 0 10px red,0 0 20px red,0 0 40px red;
    margin-bottom:15px;
}

h2{
    font-size:38px;
    color:gold;
    margin-bottom:30px;
}

p{
    font-size:22px;
    color:#ddd;
    margin-bottom:40px;
    line-height:1.6;
}

button{
    width:260px;
    height:65px;
    margin:10px;
    font-size:24px;
    border:none;
    border-radius:15px;
    cursor:pointer;
    background:#ff3030;
    color:white;
    transition:.25s;
    box-shadow:0 0 15px red;
}

button:hover{
    transform:scale(1.08);
    background:#ff5a5a;
}

.version{
    position:absolute;
    bottom:20px;
    color:#777;
    font-size:16px;
}

#howToPlay{
    display:none;
    margin-top:20px;
    background:rgba(0,0,0,0.7);
    padding:20px;
    border-radius:15px;
    border:2px solid red;
}

#howToPlay h3{
    margin-bottom:10px;
    color:gold;
}

#howToPlay button{
    width:150px;
    height:45px;
    font-size:18px;
    margin-top:15px;
}
</style>
</head>

<body>

<div class="menu">

<h1>천재채호</h1>

<h2>⚔️ BOSS SHOOTER ⚔️</h2>

<p>
최강의 보스를 물리쳐라!<br>
총알을 피하고 승리를 쟁취하라!
</p>

<!-- 게임 시작 -->
<button onclick="startGame()">🎮 게임 시작</button>

<!-- 게임 방법 -->
<button onclick="showGuide()">📖 게임 방법</button>

<!-- 설정 -->
<button onclick="settings()">지진</button>

<div id="howToPlay">
<h3>게임 방법</h3>

<p>
W A S D : 이동<br>
마우스 : 조준<br>
좌클릭 : 총 발사<br>
Shift : 대시
</p>

<button onclick="hideGuide()">닫기</button>

</div>

<div class="version">
Made by 천재채호
</div>

</div>

<script>
function startGame(){
    // main.html로 이동
    window.location.href = "main.html";
}

function showGuide(){
    document.getElementById("howToPlay").style.display="block";
}

function hideGuide(){
    document.getElementById("howToPlay").style.display="none";
}

function settings(){
    alert("설정 기능은 추후 추가됩니다.");
}
</script>

</body>
</html>
