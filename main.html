<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Boss Phase 2</title>

<style>
body{
margin:0;
overflow:hidden;
background:#111;
}
canvas{
display:block;
background:#222;
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<script>

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

canvas.width=innerWidth;
canvas.height=innerHeight;


// 플레이어
const player={
x:canvas.width/2,
y:canvas.height-150,
width:40,
height:40,
speed:5,
hp:100
};


// 키
const keys={};

addEventListener("keydown",e=>{
keys[e.key.toLowerCase()]=true;
});

addEventListener("keyup",e=>{
keys[e.key.toLowerCase()]=false;
});


// 마우스
const mouse={x:0,y:0};

canvas.onmousemove=e=>{
mouse.x=e.clientX;
mouse.y=e.clientY;
};


// 총알
const bullets=[];


// 보스
const boss={

x:canvas.width/2-80,
y:80,

width:160,
height:160,

hp:1000,
maxHp:1000,

alive:true,

phase:1,

attackTime:0,
attackDelay:800,

moveSpeed:2,

direction:1,

skillTime:0,
skillDelay:5000

};


// 적 총알
const enemyBullets=[];


// 연사
let shooting=false;
let lastShot=0;

const fireDelay=120;


canvas.onmousedown=()=>{
shooting=true;
};

canvas.onmouseup=()=>{
shooting=false;
};



// 플레이어 이동
function move(){

if(keys["w"])player.y-=player.speed;
if(keys["s"])player.y+=player.speed;
if(keys["a"])player.x-=player.speed;
if(keys["d"])player.x+=player.speed;

}



// 보스 이동
function bossMove(){

if(!boss.alive)return;


boss.x += boss.moveSpeed * boss.direction;


// 벽 튕기기

if(
boss.x<0 ||
boss.x+boss.width>canvas.width
){

boss.direction*=-1;

}


// 2페이즈 강화

if(boss.hp<=500){

boss.phase=2;

boss.moveSpeed=5;

}

}



// 총 발사
function shoot(){

let angle=Math.atan2(
mouse.y-(player.y+20),
mouse.x-(player.x+20)
);


bullets.push({

x:player.x+20,
y:player.y+20,

vx:Math.cos(angle)*12,
vy:Math.sin(angle)*12

});

}



// 보스 공격
function bossAttack(){

if(!boss.alive)return;


let now=Date.now();


// 일반 공격

if(now-boss.attackTime>boss.attackDelay){

boss.attackTime=now;


let angle=Math.atan2(
player.y-boss.y,
player.x-boss.x
);


enemyBullets.push({

x:boss.x+80,
y:boss.y+80,

vx:Math.cos(angle)*6,
vy:Math.sin(angle)*6

});


}



// 필살기

if(
boss.phase===2 &&
now-boss.skillTime>boss.skillDelay
){

boss.skillTime=now;


for(let i=0;i<36;i++){

let angle=i*Math.PI/18;


enemyBullets.push({

x:boss.x+80,
y:boss.y+80,

vx:Math.cos(angle)*7,
vy:Math.sin(angle)*7

});


}


}

}



// 업데이트
function update(){

move();

bossMove();


// 연사

let now=Date.now();

if(
shooting &&
now-lastShot>fireDelay
){

shoot();

lastShot=now;

}


// 플레이어 총알

for(let i=bullets.length-1;i>=0;i--){

let b=bullets[i];


b.x+=b.vx;
b.y+=b.vy;



if(
boss.alive &&
b.x>boss.x &&
b.x<boss.x+boss.width &&
b.y>boss.y &&
b.y<boss.y+boss.height
){

boss.hp-=10;

bullets.splice(i,1);


if(boss.hp<=0){

boss.hp=0;
boss.alive=false;

}

}


}


// 보스 공격

bossAttack();


// 적 탄 이동

for(let i=enemyBullets.length-1;i>=0;i--){

let b=enemyBullets[i];


b.x+=b.vx;
b.y+=b.vy;



// 플레이어 즉사

if(

b.x>player.x &&
b.x<player.x+player.width &&
b.y>player.y &&
b.y<player.y+player.height

){

alert("💀 보스 필살기에 당했습니다!");

location.reload();

}



}

}



// 그리기

function draw(){

ctx.clearRect(
0,
0,
canvas.width,
canvas.height
);


// 플레이어

ctx.fillStyle="cyan";

ctx.fillRect(
player.x,
player.y,
player.width,
player.height
);



// 총알

ctx.fillStyle="yellow";

bullets.forEach(b=>{

ctx.beginPath();

ctx.arc(
b.x,
b.y,
5,
0,
Math.PI*2
);

ctx.fill();

});



// 보스

if(boss.alive){

ctx.fillStyle=
boss.phase===2 ? "purple":"red";


ctx.fillRect(
boss.x,
boss.y,
boss.width,
boss.height
);


// HP

ctx.fillStyle="gray";
ctx.fillRect(100,20,400,30);


ctx.fillStyle="lime";

ctx.fillRect(
100,
20,
400*(boss.hp/boss.maxHp),
30
);


ctx.fillStyle="white";
ctx.font="25px Arial";

ctx.fillText(
"BOSS HP : "+boss.hp,
250,
75
);



if(boss.phase===2){

ctx.fillStyle="red";
ctx.font="40px Arial";

ctx.fillText(
"🔥 PHASE 2 🔥",
canvas.width/2-120,
130
);

}

}



// 보스 탄환

ctx.fillStyle="orange";

enemyBullets.forEach(b=>{

ctx.beginPath();

ctx.arc(
b.x,
b.y,
10,
0,
Math.PI*2
);

ctx.fill();

});



// 클리어

if(!boss.alive){

ctx.fillStyle="gold";
ctx.font="70px Arial";

ctx.fillText(
"🏆 BOSS CLEAR!",
canvas.width/2-250,
canvas.height/2
);

}


}



// 실행

function loop(){

update();

draw();

requestAnimationFrame(loop);

}


loop();

</script>

</body>
</html>
