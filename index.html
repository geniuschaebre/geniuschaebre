<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>천재채호 - 보스전</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#000;
    overflow:hidden;
    font-family:"Malgun Gothic",sans-serif;
    color:white;
}


.menu{
    width:100%;
    height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
}


h1{
    font-size:80px;
    color:red;
    text-shadow:0 0 20px red;
}


h2{
    color:gold;
    font-size:38px;
    margin:20px;
}


p{
    font-size:22px;
    margin:20px;
}


button{
    width:260px;
    height:65px;
    margin:10px;
    font-size:24px;
    border:none;
    border-radius:15px;
    background:red;
    color:white;
    cursor:pointer;
}


button:hover{
    transform:scale(1.1);
}


#guide{
    display:none;
    background:#222;
    border:2px solid red;
    padding:20px;
    border-radius:15px;
}


#earth{
    display:none;
    width:100%;
    height:100vh;
    background:
    linear-gradient(#001,#004),
    url("https://upload.wikimedia.org/wikipedia/commons/8/83/Earthmap1000x500.jpg");
    background-size:cover;
    text-align:center;
    padding-top:200px;
}


#earth h1{
    color:cyan;
}


.back{
    background:blue;
}


</style>

</head>


<body>


<!-- 메인 화면 -->

<div class="menu" id="main">


<h1>천재채호</h1>


<h2>⚔️ BOSS SHOOTER ⚔️</h2>


<p>
최강의 보스를 물리쳐라!<br>
총알을 피하고 승리를 쟁취하라!
</p>



<button onclick="startGame()">
🎮 게임 시작
</button>


<button onclick="showGuide()">
📖 게임 방법
</button>


<button onclick="location.href='earth.html'">
🌎 지진
</button>



<div id="guide">

<h3>게임 방법</h3>

<p>
W A S D : 이동<br>
마우스 : 조준<br>
좌클릭 : 총 발사<br>
Shift : 대시
</p>


<button onclick="hideGuide()">
닫기
</button>


</div>


</div>





<!-- 지진 화면 -->

<div id="earth">


<script>


function startGame(){

    alert("main 게임 시작!");

}



function showGuide(){

    document.getElementById("guide").style.display="block";

}



function hideGuide(){

    document.getElementById("guide").style.display="none";

}



// 지진 버튼
function earthPage(){

    document.getElementById("main").style.display="none";

    document.getElementById("earth").style.display="block";

}



// 돌아가기
function backHome(){

    document.getElementById("earth").style.display="none";

    document.getElementById("main").style.display="flex";

}


</script>


</body>
</html>
