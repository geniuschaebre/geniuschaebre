<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>천재채호 - 보스전</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:linear-gradient(#111,#000);
    overflow:hidden;
    font-family:"Malgun Gothic", sans-serif;
}

/* 움직이는 배경 */
body::before{
    content:"";
    position:fixed;
    width:200%;
    height:200%;
    background:
        radial-gradient(white 1px, transparent 1px);
    background-size:50px 50px;
    opacity:0.15;
    animation:stars 40s linear infinite;
}

@keyframes stars{
    from{transform:translateY(0);}
    to{transform:translateY(-500px);}
}

.menu{
    position:absolute;
    width:100%;
    height:100%;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    color:white;
    text-align:center;
}

h1{
    font-size:80px;
    color:#ff3030;
    text-shadow:
        0 0 10px red,
        0 0 20px red,
        0 0 40px red;
    margin-bottom:15px;
}

h2{
    font-size:38px;
    color:gold;
    margin-bottom:30px;
}

p{
    font-size:22px;
    color:#ddd;
    margin-bottom:40px;
}

button{
    width:260px;
    height:65px;
    margin:10px;
    font-size:24px;
    border:none;
    border-radius:15px;
    cursor:pointer;
    background:#ff3030;
    color:white;
    transition:.25s;
    box-shadow:0 0 15px red;
}

button:hover{
    transform:scale(1.08);
    background:#ff5a5a;
}

.version{
    position:absolute;
    bottom:20px;
    color:#777;
    font-size:16px;
}
</style>
</head>

<body>

<div class="menu">

<h1>천재채호</h1>

<h2>⚔️ BOSS SHOOTER ⚔️</h2>

<p>
최강의 보스를 물리쳐라!<br>
총알을 피하고 승리를 쟁취하라!
</p>

<button onclick="alert('게임 시작!')">🎮 게임 시작</button>

<button onclick="alert('조작법\n\nWASD : 이동\n마우스 : 조준\n좌클릭 : 발사\nShift : 대시')">
📖 게임 방법
</button>

<button onclick="alert('설정은 준비 중입니다.')">
⚙️ 설정
</button>

<div class="version">
Made by 천재채호
</div>

</div>

</body>
</html>
<button onclick="location.href='main.html'">
    🎮 게임 시작
</button>
